# Pins every Robolectric test to a long-stable, definitely-supported simulated SDK level instead of
# inferring one from compileSdk/targetSdk (36) - CI (a fresh runner, no local Android SDK/Robolectric
# jar cache) failed with "UnsupportedOperationException at DefaultSdkProvider" resolving an SDK
# shadow for 36 even though it ran fine locally; none of these tests exercise anything SDK-36-
# specific (pure Compose rendering + ViewModel interaction), so there is no reason to chase that.
sdk=34
