# Builds upon detekt's own default ruleset (buildUponDefaultConfig = true in app/build.gradle.kts) -
# this file only overrides the handful of rules that are either noisy for an early-stage app or need
# a wider threshold, it does not redefine the whole ruleset from scratch.
style:
  MagicNumber:
    active: false
  ReturnCount:
    # Early-return validation/branching (reject malformed input, map a 404 to a distinct state,
    # give up on a failed network call) is this codebase's deliberate style throughout - see
    # AuthRepository/OnboardingRepository/TokenAuthenticator - not a complexity smell to flatten.
    max: 6

complexity:
  LongMethod:
    threshold: 80
  TooManyFunctions:
    active: false
  LongParameterList:
    # A UiState + one callback per user action is this app's whole architecture (unidirectional
    # state, per the design doc) - bundling those into a params object would be ceremony, not
    # clarity, for a Composable that just renders a state and wires up its actions.
    functionThreshold: 8

naming:
  FunctionNaming:
    # Compose functions are PascalCase by convention (a Composable is a type-like constructor,
    # not a verb), which the default camelCase rule would otherwise flag on every screen function.
    ignoreAnnotated: ["Composable"]
