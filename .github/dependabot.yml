# Monthly and grouped on purpose: every Dependabot pull request runs the CI workflows, and on the free GitHub plan
# (2,000 Actions minutes a month for a private repo) dozens of weekly pull requests used up the allowance.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Waits this many days after a new version is published before proposing it - a newly published
    # package is the likeliest moment for a supply-chain compromise to still be live and un-yanked
    # (security review finding: package_managers.dependabot.dependabot-missing-cooldown).
    cooldown:
      default-days: 7
    # One grouped pull request per ecosystem instead of one per package, so checks run once, not dozens of times.
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend/website"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # One grouped pull request per ecosystem instead of one per package, so checks run once, not dozens of times.
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend/admin"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # One grouped pull request per ecosystem instead of one per package, so checks run once, not dozens of times.
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/mobile/android-customer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # One grouped pull request per ecosystem instead of one per package, so checks run once, not dozens of times.
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/mobile/android-driver"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # One grouped pull request per ecosystem instead of one per package, so checks run once, not dozens of times.
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # One grouped pull request per ecosystem instead of one per package, so checks run once, not dozens of times.
    groups:
      all-updates:
        patterns: ["*"]
