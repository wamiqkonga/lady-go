name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The open-source gitleaks CLI (MIT), not gitleaks/gitleaks-action: the action needs a paid
      # GITLEAKS_LICENSE for any organization-owned repo (this repo moved to the Lady-Go org), the CLI
      # itself does not. Pinned to a release and verified against the SHA-256 published in that
      # release's checksums file, so a swapped download fails the job instead of running unreviewed.
      # Scans the full git history (fetch-depth 0 above) and fails the job on any finding; --redact keeps
      # matched secret values out of the build log.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  # Free, no API key, works on private repos with no GitHub Advanced Security license (unlike CodeQL -
  # see the disabled "codeql" job below for why that one isn't included yet). Diffs a PR's dependency
  # changes against known advisories; only runs on pull_request (it has nothing to diff on a plain push).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  # OWASP Dependency-Check against the backend's resolved Maven dependencies. Needs secrets.NVD_API_KEY -
  # confirmed in CI (not just documented from the tool's own docs): dependency-check-maven 13.x hard-
  # rejects an empty/missing key outright ("Invalid API Key, length of 0") rather than falling back to
  # slow unauthenticated access, so without the secret this step is SKIPPED cleanly instead of failing
  # on every run. Get a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a
  # repo secret named NVD_API_KEY to turn this on.
  owasp-dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The `secrets` context isn't available in `if:` conditions at all (only in env/with/run) - so
      # the key's presence is captured here as a step output first, which `if:` CAN read.
      - name: Check for NVD API key
        id: check-key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping OWASP Dependency-Check - no NVD_API_KEY repo secret configured. See this job's definition in .github/workflows/security.yml for how to get one."
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.check-key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        if: steps.check-key.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=9
          -Dformats=HTML,JSON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.check-key.outputs.present == 'true' && always()
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.*
          retention-days: 7

  # SAST via Semgrep's local CLI (not the `semgrep-action`/`semgrep ci` GitHub integration, which talks
  # to Semgrep's own cloud service and would need yet another API token) - no account or secret needed.
  # Results go to a build artifact, not GitHub's code-scanning tab - that upload path is the same GHAS
  # wall that blocks CodeQL below, so this deliberately never calls
  # `github/codeql-action/upload-sarif` or equivalent.
  #
  # Security review findings on the first version of this job:
  # - `pip install semgrep` with no version pin let CI silently pick up a new, unreviewed Semgrep
  #   release on every run (supply-chain risk - an unpinned CLI tool is as much a dependency as
  #   anything in pom.xml/package.json). Pinned below.
  # - `--config auto` is NOT a local/offline ruleset choice (an earlier version of this comment claimed
  #   it was, incorrectly) - it calls out to Semgrep's registry AND sends repo metadata (language mix,
  #   rough size) to pick which rulesets to auto-apply, which is both an "untrusted remote config
  #   fetched at runtime" and a "telemetry to a third party" concern for a private repo. First replaced
  #   with the single `p/ci` pack, which fixed that but was a real detection-coverage regression - `p/ci`
  #   is a small CI-smoke-test set, nowhere near what `auto` would actually have selected. Replaced
  #   again with an explicit, fixed list of named registry packs matching this repo's real stack
  #   (general security-audit + OWASP Top Ten, plus the four languages actually in this repo: Java,
  #   TypeScript, Kotlin, Swift) - verified locally that all five pack names resolve (693 rules loaded
  #   for a one-file Java smoke test). Still a network fetch (no local rule vendoring in this pass), but
  #   no dynamic auto-detection phone-home, and `SEMGREP_SEND_METRICS=off` explicitly disables
  #   Semgrep's own anonymous usage-metrics ping that would otherwise fire regardless of config.
  #
  # One further finding on this version, accepted as a documented tradeoff rather than fixed, since
  # there's no clean low-effort fix and it's lower-severity than the rounds above:
  # - The named registry packs (`p/security-audit` etc.) aren't pinned to a specific version/commit -
  #   Semgrep's registry doesn't version packs the way `pip`/Maven version a release, so "pinning" one
  #   would mean vendoring the whole rules repo at a fixed commit instead of referencing the registry at
  #   all. A scanner's ruleset drifting over time (more/different findings on the same code) is the
  #   normal, expected behavior of a maintained threat-detection feed, not a supply-chain risk in the
  #   same sense as an unpinned CLI tool or library - accepted as-is.
  #
  # All 42 findings from this job's first real run have been triaged (fixed, suppressed with a
  # written reason, or accepted) - see docs/security/sast-triage.md. The job now gates for real:
  # ERROR/HIGH/CRITICAL severity findings fail the job (no continue-on-error on that step); WARNING/
  # MEDIUM/LOW/INFO are still reported (as GitHub Actions warning annotations) but non-blocking.
  sast:
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep==1.180.0
      - name: Semgrep scan
        # No --error here deliberately - this step's own exit code must stay 0 regardless of findings,
        # since non-blocking lower-severity findings are expected and reported by the gate step below,
        # not by this step failing. The gate step (not this one) is what enforces the severity cutoff.
        run: >
          semgrep scan
          --config p/security-audit --config p/owasp-top-ten
          --config p/java --config p/typescript --config p/kotlin --config p/swift --config p/react
          --json --output semgrep-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 7
      - name: Enforce SAST severity gate
        # Semgrep's own findings mix two severity scales depending on rule type: the native
        # INFO/WARNING/ERROR scale, and a newer LOW/MEDIUM/HIGH/CRITICAL scale used by some newer rule
        # packs (e.g. supply-chain config rules). ERROR/HIGH/CRITICAL fail this job; everything else is
        # reported as a non-blocking warning annotation. No continue-on-error on this step or job -
        # a real high-severity finding must fail CI.
        run: |
          python3 - <<'PY'
          import json, sys

          with open("semgrep-results.json") as f:
              data = json.load(f)

          blocking = {"ERROR", "HIGH", "CRITICAL"}
          results = data.get("results", [])
          blockers = [r for r in results if r["extra"]["severity"] in blocking]
          reported = [r for r in results if r["extra"]["severity"] not in blocking]

          for r in reported:
              msg = r["extra"]["message"].splitlines()[0]
              print(f"::warning file={r['path']},line={r['start']['line']}::[{r['extra']['severity']}] {r['check_id']}: {msg}")

          for r in blockers:
              msg = r["extra"]["message"].splitlines()[0]
              print(f"::error file={r['path']},line={r['start']['line']}::[{r['extra']['severity']}] {r['check_id']}: {msg}")

          print(f"SAST gate: {len(blockers)} high/error-severity finding(s), {len(reported)} lower-severity finding(s) reported non-blocking.")
          if blockers:
              sys.exit(1)
          PY

  # Disabled: this repo is private, owned by a personal (not Organization) account, on the Free plan.
  # CodeQL/code scanning on a private repo requires a GitHub Code Security (Advanced Security) license,
  # which personal accounts cannot purchase at all - only Organizations on GitHub Team/Enterprise can
  # (confirmed via the repo's code-scanning API, which 403s: "Code scanning is not enabled for this
  # repository" - and via GitHub's own docs on this exact restriction). It's free only for public repos.
  # To enable: make the repo public, or move it into an Organization with Code Security enabled, then
  # flip `if: false` to `if: true` below - everything else is ready to run as-is.
  codeql:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          languages: java-kotlin, javascript-typescript, swift
      - uses: github/codeql-action/autobuild@9f759ee644a3e7c15c1390abf49868036c00067b # v3
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
