name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Free, no API key, works on private repos with no GitHub Advanced Security license (unlike CodeQL -
  # see the disabled "codeql" job below for why that one isn't included yet). Diffs a PR's dependency
  # changes against known advisories; only runs on pull_request (it has nothing to diff on a plain push).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  # OWASP Dependency-Check against the backend's resolved Maven dependencies. Needs secrets.NVD_API_KEY -
  # confirmed in CI (not just documented from the tool's own docs): dependency-check-maven 13.x hard-
  # rejects an empty/missing key outright ("Invalid API Key, length of 0") rather than falling back to
  # slow unauthenticated access, so without the secret this step is SKIPPED cleanly instead of failing
  # on every run. Get a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a
  # repo secret named NVD_API_KEY to turn this on.
  owasp-dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # The `secrets` context isn't available in `if:` conditions at all (only in env/with/run) - so
      # the key's presence is captured here as a step output first, which `if:` CAN read.
      - name: Check for NVD API key
        id: check-key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping OWASP Dependency-Check - no NVD_API_KEY repo secret configured. See this job's definition in .github/workflows/security.yml for how to get one."
          fi
      - uses: actions/setup-java@v4
        if: steps.check-key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check
        if: steps.check-key.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=9
          -Dformats=HTML,JSON
      - uses: actions/upload-artifact@v4
        if: steps.check-key.outputs.present == 'true' && always()
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.*
          retention-days: 30

  # SAST via Semgrep's local CLI (not the `semgrep-action`/`semgrep ci` GitHub integration, which talks
  # to Semgrep's own cloud service and would need yet another API token) - no account or secret needed.
  # Results go to a build artifact, not GitHub's code-scanning tab - that upload path is the same GHAS
  # wall that blocks CodeQL below, so this deliberately never calls
  # `github/codeql-action/upload-sarif` or equivalent. continue-on-error until a first run's findings
  # have actually been triaged (same reasoning as the OWASP job's CVSS threshold starting permissive) -
  # tighten once there's a baseline.
  #
  # Security review findings on the first version of this job:
  # - `pip install semgrep` with no version pin let CI silently pick up a new, unreviewed Semgrep
  #   release on every run (supply-chain risk - an unpinned CLI tool is as much a dependency as
  #   anything in pom.xml/package.json). Pinned below.
  # - `--config auto` is NOT a local/offline ruleset choice (an earlier version of this comment claimed
  #   it was, incorrectly) - it calls out to Semgrep's registry AND sends repo metadata (language mix,
  #   rough size) to pick which rulesets to auto-apply, which is both an "untrusted remote config
  #   fetched at runtime" and a "telemetry to a third party" concern for a private repo. First replaced
  #   with the single `p/ci` pack, which fixed that but was a real detection-coverage regression - `p/ci`
  #   is a small CI-smoke-test set, nowhere near what `auto` would actually have selected. Replaced
  #   again with an explicit, fixed list of named registry packs matching this repo's real stack
  #   (general security-audit + OWASP Top Ten, plus the four languages actually in this repo: Java,
  #   TypeScript, Kotlin, Swift) - verified locally that all five pack names resolve (693 rules loaded
  #   for a one-file Java smoke test). Still a network fetch (no local rule vendoring in this pass), but
  #   no dynamic auto-detection phone-home, and `SEMGREP_SEND_METRICS=off` explicitly disables
  #   Semgrep's own anonymous usage-metrics ping that would otherwise fire regardless of config.
  sast:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep==1.180.0
      - name: Semgrep scan
        run: >
          semgrep scan
          --config p/security-audit --config p/owasp-top-ten
          --config p/java --config p/typescript --config p/kotlin --config p/swift
          --json --output semgrep-results.json --error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # Disabled: this repo is private, owned by a personal (not Organization) account, on the Free plan.
  # CodeQL/code scanning on a private repo requires a GitHub Code Security (Advanced Security) license,
  # which personal accounts cannot purchase at all - only Organizations on GitHub Team/Enterprise can
  # (confirmed via the repo's code-scanning API, which 403s: "Code scanning is not enabled for this
  # repository" - and via GitHub's own docs on this exact restriction). It's free only for public repos.
  # To enable: make the repo public, or move it into an Organization with Code Security enabled, then
  # flip `if: false` to `if: true` below - everything else is ready to run as-is.
  codeql:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin, javascript-typescript, swift
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
