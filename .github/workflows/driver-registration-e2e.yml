name: Driver registration web E2E

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", "frontend/driver-registration/**", "scripts/ci/**", ".github/workflows/driver-registration-e2e.yml"]
  pull_request:
    paths: ["backend/**", "frontend/driver-registration/**", "scripts/ci/**", ".github/workflows/driver-registration-e2e.yml"]
  workflow_dispatch:
    inputs:
      repeat:
        description: "Number of parallel repeated runs (for measuring the suite's real pass rate)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  # Only runs anything on a manual dispatch - computes [1..repeat] so the e2e job below can fan out
  # into that many parallel, independent matrix runs. Same pattern as admin-web-e2e.yml.
  setup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          python3 -c "import json,os; n=int(os.environ['REPEAT']); print('matrix=' + json.dumps(list(range(1, n + 1))))" >> "$GITHUB_OUTPUT"
        env:
          REPEAT: ${{ github.event.inputs.repeat }}

  e2e:
    needs: [setup]
    if: always() && (github.event_name != 'workflow_dispatch' || needs.setup.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ github.event_name == 'workflow_dispatch' && fromJson(needs.setup.outputs.matrix) || fromJson('[1]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ladygo
          POSTGRES_USER: ladygo
          POSTGRES_PASSWORD: ci_throwaway_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ladygo -d ladygo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ladygo
      PGPASSWORD: ci_throwaway_password
      PGDATABASE: ladygo
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ladygo
      SPRING_DATASOURCE_USERNAME: ladygo
      SPRING_DATASOURCE_PASSWORD: ci_throwaway_password
      LADYGO_CORS_ALLOWED_ORIGINS: http://localhost:5175
      DRIVER_REG_E2E_API_BASE_URL: http://localhost:8080
      DRIVER_REG_E2E_BASE_URL: http://localhost:5175
      BACKEND_LOG: ${{ github.workspace }}/backend.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/driver-registration/package-lock.json

      - name: Generate throwaway secrets for this run only
        run: |
          {
            echo "LADYGO_JWT_SECRET=$(openssl rand -base64 48)"
            echo "LADYGO_OTP_HASH_SECRET=$(openssl rand -base64 48)"
            echo "LADYGO_MFA_ENC_KEY=$(openssl rand -base64 24 | cut -c1-32)"
            echo "LADYGO_RIDE_PIN_SECRET=$(openssl rand -base64 48)"
            echo "LADYGO_LOCAL_STORAGE_SECRET=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      - name: Build the backend
        working-directory: backend
        run: mvn -q -B -DskipTests package

      - name: Start the backend (dev profile)
        working-directory: backend
        run: |
          nohup java -jar target/*.jar > "$BACKEND_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for _ in $(seq 1 120); do
            grep -q "Started LadyGoApplication" "$BACKEND_LOG" && exit 0
            grep -q "APPLICATION FAILED TO START" "$BACKEND_LOG" && { cat "$BACKEND_LOG"; exit 1; }
            sleep 1
          done
          echo "Backend did not start within 120s"; cat "$BACKEND_LOG"; exit 1

      - name: Seed one city and the reject-then-resubmit fixture
        run: scripts/ci/driver-registration-e2e-seed.sh

      - name: Install driver-registration dependencies
        working-directory: frontend/driver-registration
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend/driver-registration
        run: npx playwright install --with-deps chromium

      - name: Start the driver registration web (dev server)
        working-directory: frontend/driver-registration
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          nohup npm run dev > "$RUNNER_TEMP/driver-registration-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/driver-registration-web.pid"
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5175/ >/dev/null && exit 0
            sleep 1
          done
          echo "driver registration web did not start within 60s"; cat "$RUNNER_TEMP/driver-registration-web.log"; exit 1

      - name: Run Playwright E2E suite
        working-directory: frontend/driver-registration
        run: npx playwright test

      - name: Upload Playwright report (traces, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.iteration }}
          path: frontend/driver-registration/playwright-report/
          retention-days: 14

      - name: Upload backend/frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ matrix.iteration }}
          path: |
            ${{ github.workspace }}/backend.log
            ${{ runner.temp }}/driver-registration-web.log
          retention-days: 14

      - name: Stop background services
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/driver-registration-web.pid" ] && kill "$(cat "$RUNNER_TEMP/driver-registration-web.pid")" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/backend.pid" ] && kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
