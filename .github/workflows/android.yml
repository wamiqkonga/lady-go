name: Android

on:
  push:
    branches: [main, develop]
    paths: ["mobile/android-*/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android-*/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [android-customer, android-driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Lint, unit tests, debug build
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
