name: Android

on:
  push:
    branches: [main, develop]
    paths: ["mobile/android-*/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android-*/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [android-customer, android-driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted Ubuntu runners already include the Android SDK (ANDROID_HOME), so we do not use
      # android-actions/setup-android (its licence-acceptance step failed). Accept licences best-effort so
      # Gradle can download any missing platform/build-tools package.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Check generated API client is up to date
        if: matrix.app == 'android-driver'
        run: gradle --no-daemon :app:checkOpenApiClientDrift
      - name: ktlint
        if: matrix.app == 'android-driver'
        run: gradle --no-daemon :app:ktlintCheck
      - name: detekt
        if: matrix.app == 'android-driver'
        run: gradle --no-daemon :app:detekt
      - name: Lint, unit tests, debug and release build
        # assembleRelease is included deliberately, not just assembleDebug - a prior release build
        # broke (R8/minify-only failures that a debug build never exercises) and shipped past CI
        # undetected until a manual release build was tried later. Running it here every time is
        # what would have caught that at the PR, not after.
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease