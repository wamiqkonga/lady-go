name: Frontend

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [website, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Check generated API client is up to date
        if: matrix.app == 'admin' || matrix.app == 'website'
        run: npm run openapi:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Check production CSP has no unsafe-inline/unsafe-eval/third-party sources
        if: matrix.app == 'admin' || matrix.app == 'website'
        run: npm run csp:check
      - name: Dependency audit
        run: npm audit --audit-level=high
