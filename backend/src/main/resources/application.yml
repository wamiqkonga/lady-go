spring:
  application:
    name: ladygo-backend
  profiles:
    default: dev
  autoconfigure:
    # We provide our own authentication in Phase 3; do not create a default in-memory user/password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # Request ID is attached to every log line via MDC (structured JSON logging comes with observability work).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

ladygo:
  cors:
    allowed-origins: ${LADYGO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
