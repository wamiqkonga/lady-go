spring:
  application:
    name: ladygo-backend
  profiles:
    default: dev
  autoconfigure:
    # We provide our own authentication in Phase 3; do not create a default in-memory user/password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      # Spring's default is 1 MB per file, which silently undercuts the service-level image limit
      # (verification.upload.max_size.bytes, 8 MB): a phone selfie / document photo over 1 MB was
      # rejected before the service ever saw it. Keep these >= that limit.
      max-file-size: 8MB
      max-request-size: 10MB
  jpa:
    # Request-scoped sessions hide lazy-loading bugs and hold connections during serialisation.
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway. Hibernate only checks entities against it at startup.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Shown at /actuator/info so anyone can tell which build is live. GIT_SHA is baked into the image by the deploy
# pipeline (Dockerfile build arg); it is "unknown" for local runs.
info:
  app:
    commit: ${GIT_SHA:unknown}

management:
  info:
    env:
      enabled: true
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Redis is fan-out-only (docs/api/matching.md section 4/7), never the source of truth - the app is
    # healthy whether or not it's reachable, so a down Redis must never flip readiness/liveness.
    redis:
      enabled: false

logging:
  pattern:
    # Request ID is attached to every log line via MDC (structured JSON logging comes with observability work).
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

ladygo:
  cors:
    allowed-origins: ${LADYGO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  websocket:
    allowed-origins: ${LADYGO_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  jwt:
    # Dev-only placeholder; staging/prod require LADYGO_JWT_SECRET with no default (see application-prod.yml).
    secret: ${LADYGO_JWT_SECRET:dev-only-insecure-jwt-secret-CHANGE-ME-0123456789}
  otp:
    # sms (default) or email (MVP 1: code delivered by email via SES, see docs/development/email-otp-setup.md)
    channel: ${LADYGO_OTP_CHANNEL:sms}
    hash-secret: ${LADYGO_OTP_HASH_SECRET:dev-only-insecure-otp-secret-CHANGE-ME-0123456789}
  email:
    # ses (default) or smtp (any SMTP relay, e.g. Resend/Brevo) - see docs/development/email-otp-setup.md
    provider: ${LADYGO_EMAIL_PROVIDER:ses}
    ses:
      region: ${LADYGO_EMAIL_SES_REGION:ap-south-1}
      from: ${LADYGO_EMAIL_FROM:}
    smtp:
      host: ${LADYGO_SMTP_HOST:}
      port: ${LADYGO_SMTP_PORT:587}
      username: ${LADYGO_SMTP_USERNAME:}
      password: ${LADYGO_SMTP_PASSWORD:}
      from: ${LADYGO_EMAIL_FROM:}
  mfa:
    enc-key: ${LADYGO_MFA_ENC_KEY:DevInsecureMfaEncKeyChangeMe1234}
  ride:
    pin-secret: ${LADYGO_RIDE_PIN_SECRET:dev-only-insecure-ride-pin-secret-CHANGE-ME-0123456789}
  storage:
    local:
      directory: ${LADYGO_LOCAL_STORAGE_DIR:./target/local-storage}
      secret: ${LADYGO_LOCAL_STORAGE_SECRET:dev-only-insecure-local-storage-secret-CHANGE-ME-01234}
      base-url: ${LADYGO_LOCAL_STORAGE_BASE_URL:http://localhost:8080}
  push:
    # logging (dev/test), fcm (set the two LADYGO_FCM_* variables), or disabled (no push yet). The logging sender is refused under staging/prod.
    provider: ${LADYGO_PUSH_PROVIDER:logging}
    fcm-project-id: ${LADYGO_FCM_PROJECT_ID:}
    fcm-service-account-json: ${LADYGO_FCM_SERVICE_ACCOUNT_JSON:}
  sms:
    # HttpSmsSender isn't even wired as a bean in dev/test (LoggingSmsSender is - see its @Profile),
    # so these blank defaults are never actually used there; staging/prod override every one with no
    # default (application-staging.yml/application-prod.yml), so a missing LADYGO_SMS_* env var fails
    # startup via Spring's own property resolution, and SmsSenderStartupGuard double-checks it.
    http:
      base-url: ${LADYGO_SMS_BASE_URL:}
      auth-header-name: ${LADYGO_SMS_AUTH_HEADER_NAME:Authorization}
      auth-header-value: ${LADYGO_SMS_AUTH_HEADER_VALUE:}
      sender-id: ${LADYGO_SMS_SENDER_ID:}
      dlt-template-id: ${LADYGO_SMS_DLT_TEMPLATE_ID:}
      dlt-entity-id: ${LADYGO_SMS_DLT_ENTITY_ID:}
      body-template: ${LADYGO_SMS_BODY_TEMPLATE:}
      response-message-id-field: ${LADYGO_SMS_RESPONSE_MESSAGE_ID_FIELD:messageId}
      response-error-code-field: ${LADYGO_SMS_RESPONSE_ERROR_CODE_FIELD:errorCode}
      connect-timeout-ms: ${LADYGO_SMS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${LADYGO_SMS_READ_TIMEOUT_MS:5000}
      max-retries: ${LADYGO_SMS_MAX_RETRIES:2}
      retry-base-delay-ms: ${LADYGO_SMS_RETRY_BASE_DELAY_MS:500}
      circuit-breaker-failure-threshold: ${LADYGO_SMS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      circuit-breaker-cooldown-ms: ${LADYGO_SMS_CIRCUIT_BREAKER_COOLDOWN_MS:30000}
  security:
    # CIDR ranges of proxies/load balancers allowed to set X-Forwarded-For. Empty: nothing trusted by
    # default; set via LADYGO_SECURITY_TRUSTEDPROXIES_0, _1, ... or a profile-specific override when deployed
    # behind a real load balancer.
    trusted-proxies: []
