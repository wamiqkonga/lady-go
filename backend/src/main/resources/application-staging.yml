# Staging profile: production-like, sandbox providers. All values come from environment variables.
# Database connection comes from the environment only; startup fails if any value is missing.
spring:
  datasource:
    url: ${LADYGO_DB_URL}
    username: ${LADYGO_DB_USERNAME}
    password: ${LADYGO_DB_PASSWORD}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

logging:
  level:
    com.ladygo: INFO

ladygo:
  cors:
    allowed-origins: ${LADYGO_CORS_ALLOWED_ORIGINS}
  websocket:
    allowed-origins: ${LADYGO_WEBSOCKET_ALLOWED_ORIGINS}
  jwt:
    secret: ${LADYGO_JWT_SECRET}
  otp:
    channel: ${LADYGO_OTP_CHANNEL:sms}
    hash-secret: ${LADYGO_OTP_HASH_SECRET}
  mfa:
    required: ${LADYGO_ADMIN_MFA_REQUIRED:false}
    enc-key: ${LADYGO_MFA_ENC_KEY}
  ride:
    pin-secret: ${LADYGO_RIDE_PIN_SECRET}
  storage:
    s3:
      bucket: ${LADYGO_S3_BUCKET}
      region: ${LADYGO_S3_REGION}
      endpoint: ${LADYGO_S3_ENDPOINT:}
      access-key: ${LADYGO_S3_ACCESS_KEY:}
      secret-key: ${LADYGO_S3_SECRET_KEY:}
  email:
    ses:
      region: ${LADYGO_EMAIL_SES_REGION:ap-south-1}
      from: ${LADYGO_EMAIL_FROM:}
  sms:
    # Required only when ladygo.otp.channel=sms: SmsSenderStartupGuard enforces non-blank values then.
    http:
      base-url: ${LADYGO_SMS_BASE_URL:}
      auth-header-name: ${LADYGO_SMS_AUTH_HEADER_NAME:Authorization}
      auth-header-value: ${LADYGO_SMS_AUTH_HEADER_VALUE:}
      sender-id: ${LADYGO_SMS_SENDER_ID:}
      dlt-template-id: ${LADYGO_SMS_DLT_TEMPLATE_ID:}
      dlt-entity-id: ${LADYGO_SMS_DLT_ENTITY_ID:}
      body-template: ${LADYGO_SMS_BODY_TEMPLATE:}
      response-message-id-field: ${LADYGO_SMS_RESPONSE_MESSAGE_ID_FIELD:messageId}
      response-error-code-field: ${LADYGO_SMS_RESPONSE_ERROR_CODE_FIELD:errorCode}
      connect-timeout-ms: ${LADYGO_SMS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${LADYGO_SMS_READ_TIMEOUT_MS:5000}
      max-retries: ${LADYGO_SMS_MAX_RETRIES:2}
      retry-base-delay-ms: ${LADYGO_SMS_RETRY_BASE_DELAY_MS:500}
      circuit-breaker-failure-threshold: ${LADYGO_SMS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      circuit-breaker-cooldown-ms: ${LADYGO_SMS_CIRCUIT_BREAKER_COOLDOWN_MS:30000}
