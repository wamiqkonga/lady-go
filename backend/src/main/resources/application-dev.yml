# Development profile: local Docker Compose services, API docs enabled.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ladygo}
    username: ${SPRING_DATASOURCE_USERNAME:ladygo}
    # No default on purpose: export the same POSTGRES_PASSWORD you put in infrastructure/.env
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  flyway:
    # Dev-only reference data (a placeholder city). Never loaded in staging or production.
    locations: classpath:db/migration,classpath:db/dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

ladygo:
  dev:
    # docs/api/ride-lifecycle.md section 13b-2: local testing convenience so a driver location update
    # doesn't need a real GPS accuracy reading. Guarded by DevOnlyFlagsStartupGuard - never true in
    # staging/prod.
    allow_missing_location_accuracy: true

logging:
  level:
    com.ladygo: DEBUG
